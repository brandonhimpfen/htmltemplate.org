---
layout: default
---
<header class="page-hero text-white text-center py-5">
  <div class="container py-4">
    <h1 class="display-5 fw-bold mb-2">{{ page.title }}</h1>
    {% if page.description %}<p class="lead mx-auto mb-0" style="max-width: 760px;">{{ page.description }}</p>{% endif %}
  </div>
</header>
<main class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-9">
        {{ content }}
      </div>
    </div>
  </div>
</main>
